name: Backend CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser for gameplay verification
        run: npx playwright install --with-deps chromium
      - name: Verify debug controls and online equipment
        run: npx playwright test tests/gameplay/admin.spec.ts tests/gameplay/character-art.spec.ts tests/gameplay/online-accounts.spec.ts tests/gameplay/online.spec.ts tests/gameplay/debug-room.spec.ts tests/gameplay/offhand-online.spec.ts tests/gameplay/offhand.spec.ts tests/gameplay/offhand-variants.spec.ts tests/gameplay/career.spec.ts tests/gameplay/expanded-guns.spec.ts
      - run: node tools/package-game.mjs
      - name: Package backend without frontend assets
        run: npm run package:server
      - run: node tools/verify-server-package.mjs
      - run: npm run test:offline
      - name: Upload gameplay diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-diagnostics-${{ github.sha }}
          path: |
            test-results/
            artifacts/qa/
          retention-days: 7
      - name: Check deployment scripts
        run: |
          bash -n deploy/install.sh deploy/release.sh deploy/enable-account-storage.sh deploy/provision-test-accounts.sh deploy/reset-test-passwords.sh deploy/enable-admin.sh
          shellcheck deploy/install.sh deploy/release.sh deploy/enable-account-storage.sh deploy/provision-test-accounts.sh deploy/reset-test-passwords.sh deploy/enable-admin.sh
      - name: Prepare release
        run: |
          cp deploy/probe.mjs artifacts/project-strike-server/
          printf '%s\n' "$GITHUB_SHA" > artifacts/project-strike-server/REVISION
          tar -czf backend.tar.gz -C artifacts/project-strike-server .
          sha256sum backend.tar.gz > backend.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: |
            backend.tar.gz
            backend.tar.gz.sha256
            deploy/release.sh
            deploy/enable-account-storage.sh
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Allow time for resumable backend uploads, the deployment lock and rollback.
    timeout-minutes: 45
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '43.142.165.82' }}
      DEPLOY_USER: strike-deploy
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Configure persistent accounts on older installations
        env:
          ADMIN_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          configured=$(ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'systemctl show project-strike.service -p StateDirectory --value')
          if [[ "$configured" == 'project-strike' ]]; then exit 0; fi
          test -n "$ADMIN_SSH_KEY" || { echo 'Persistent storage requires the administrator SSH_PRIVATE_KEY for the one-time service upgrade.' >&2; exit 1; }
          printf '%s\n' "$ADMIN_SSH_KEY" > ~/.ssh/account-admin
          chmod 600 ~/.ssh/account-admin
          trap 'rm -f ~/.ssh/account-admin' EXIT
          ssh "${opts[@]}" -i ~/.ssh/account-admin -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "ubuntu@$DEPLOY_HOST" 'sudo -n bash -s' < deploy/enable-account-storage.sh
      - name: Upload and activate verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'Skipping superseded commit; deploy the latest main run.'
            exit 0
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="/opt/project-strike/incoming/$release"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          echo "[deploy] Creating remote staging directory for $release"
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          upload_bundle() {
            local attempt ssh_command
            ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'command -v rsync >/dev/null' || {
              echo '[deploy] Remote host requires rsync for resumable release uploads' >&2
              return 1
            }
            ssh_command="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p $DEPLOY_PORT"
            for attempt in 1 2; do
              echo "[deploy] Uploading verified backend bundle (attempt $attempt/2; resumable rsync)"
              # Only backend files are transferred. --timeout limits idle I/O;
              # --partial plus --append-verify resumes interrupted uploads safely.
              if rsync -a --partial --append-verify --human-readable --info=progress2 \
                --timeout=120 -e "$ssh_command" \
                backend.tar.gz backend.tar.gz.sha256 deploy/release.sh \
                "$DEPLOY_USER@$DEPLOY_HOST:$remote/"; then
                return 0
              fi

              echo "[deploy] Upload attempt $attempt/2 failed after 120 seconds without I/O" >&2
              if (( attempt < 2 )); then
                echo '[deploy] Retrying once; preserving the partial bundle for rsync resume'
                sleep 5
              fi
            done
            return 1
          }
          upload_bundle
          echo '[deploy] Activating release on remote host (the release script may wait up to 5 minutes for deploy.lock)'
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$remote/release.sh' '$release'"
          echo '[deploy] Remote release completed successfully'
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/account-admin
