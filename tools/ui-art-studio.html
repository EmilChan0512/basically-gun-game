<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Strike · 素材工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c141d;color:#dfebe9;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:24px 32px;border-bottom:1px solid #344450;display:flex;align-items:center;gap:20px}h1{font-size:22px;margin:0}header small{color:#9ab8bd}a{color:#90d7d0}main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:85vh}aside{padding:18px;border-right:1px solid #344450}button,input,textarea,select{font:inherit}button{border:1px solid #536972;background:#23343e;color:#e0ece8;padding:10px 14px;cursor:pointer;border-radius:4px}button:hover{border-color:#a0d6cf}button:disabled{opacity:.45;cursor:wait}aside button{display:block;width:100%;text-align:left;margin-bottom:6px}aside button[aria-pressed=true]{background:#345456;border-color:#9bd7c9}aside small{display:block;color:#93adb4}article{padding:28px;min-width:0}h2{margin:0}#description{color:#a9bdc2}.editor{display:grid;grid-template-columns:1fr 210px;gap:16px;padding:20px;background:#14232d;border:1px solid #344450;margin:20px 0}textarea{width:100%;height:180px;background:#0c1820;color:#dae9e9;padding:12px;border:1px solid #49606a}input,select{width:100%;background:#0c1820;color:#dfebe9;border:1px solid #49606a;padding:8px;margin:5px 0 12px}.primary{background:#c8b079;color:#151c21;font-weight:bold;width:100%}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.candidate{background:#15242e;border:1px solid #3b5260;padding:16px;min-width:0}.candidate.selected{border-color:#8fcebb}.candidate img{width:100%;height:240px;object-fit:contain;background:#091019;display:block;cursor:zoom-in}.candidate h3{font:13px Consolas,monospace;overflow-wrap:anywhere}.candidate p{color:#9cb5bd;font-size:12px}.candidate footer{display:flex;justify-content:space-between;align-items:center;gap:10px}.preview{padding:18px;display:flex;gap:10px;flex-wrap:wrap}.preview button{border:10px solid transparent;border-image:var(--asset) 40 fill / 10px / 0 stretch;background:none;color:#eef4e9;text-shadow:0 1px 2px #000;padding:5px 16px;min-width:120px}#status{min-height:24px;color:#d6c28e;white-space:pre-wrap}dialog{background:#0a151e;color:white;border:1px solid #6f8f97;max-width:95vw}dialog img{display:block;max-width:88vw;max-height:80vh}dialog::backdrop{background:#000b}.note{font-size:12px;color:#9fb5be}#feedback{color:#ecc89c}button:focus-visible,a:focus-visible{outline:2px solid #e3c087;outline-offset:3px}@media(max-width:850px){main{grid-template-columns:1fr}aside{display:flex;overflow:auto}aside button{min-width:180px}.gallery,.editor{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
<header><div><h1>Project Strike / 素材工作台</h1><small>本地 ComfyUI · 每张图片都有独立工作流</small></div><a href="http://127.0.0.1:8188" target="_blank" rel="noreferrer">打开 ComfyUI ↗</a><a href="http://127.0.0.1:5173/?offline" id="game-link" target="_blank" rel="noreferrer">游戏预览 ↗</a></header>
<main><aside id="assets" aria-label="素材列表"></aside><article><h2 id="title"></h2><p id="description"></p><a id="workflow">下载可拖入 ComfyUI 的工作流</a><div class="editor"><label>完整提示词（修改只影响本轮候选图，历史保留）<textarea id="prompt"></textarea></label><div><label>随机种子（留空随机）<input id="seed" type="number" min="0" step="1" placeholder="随机抽卡"></label><label>本轮数量<select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="generate" class="primary">生成候选图</button></div></div><p id="status" role="status"></p><p id="feedback" role="alert"></p><p class="note">“选用这张”只替换开发工作区当前素材。运行 npm run dev 查看游戏效果；发行需要重新运行 npm run release。工作流下载后可拖入 ComfyUI 调整模型和节点。小按钮预览展示九宫格拉伸后的效果。</p><div id="gallery" class="gallery"></div></article></main>
<dialog id="zoom"><button id="close">关闭</button><img alt="素材原图"></dialog>
<script type="module">
let state, current, signature='';
const el=id=>document.getElementById(id), escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(id,candidate)=>'/image?'+new URLSearchParams({id,candidate});
async function post(path,data){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function choose(id){current=id;signature='';const a=state.assets.find(a=>a.id===id);el('title').textContent=a.name+' / '+a.id;el('description').textContent=a.usage+' · '+a.width+' × '+a.height;el('prompt').value=a.prompt;el('seed').value='';el('workflow').href='/workflow?id='+encodeURIComponent(id);render();}
function render(){
 el('assets').innerHTML=state.assets.map(a=>`<button data-id="${a.id}" aria-pressed="${a.id===current}">${escape(a.name)}<small>${a.candidates.filter(c=>c.status==='complete').length} 张候选 · ${a.selected?'已选用':'待选用'}</small></button>`).join('');
 el('generate').disabled=state.busy;el('status').textContent=state.busy?'ComfyUI 正在生成，候选图会自动出现在下方。':'就绪 · 可修改提示词后生成新候选';el('feedback').textContent=state.error||'';
 const a=state.assets.find(a=>a.id===current);if(!a)return;
 const next=JSON.stringify([a.candidates,a.selected,state.busy]);if(next===signature)return;signature=next;
 el('gallery').innerHTML=a.candidates.map(c=>c.status==='complete'?`<section class="candidate ${a.selected===c.candidate?'selected':''}"><img data-zoom="${escape(image(a.id,c.candidate))}" src="${escape(image(a.id,c.candidate))}" alt="${escape(a.name)} 候选图">${a.kind==='button'?`<div class="preview" style="--asset:url('${escape(image(a.id,c.candidate))}')"><button type="button">继续行动</button><button type="button">返回</button></div>`:''}<h3>${escape(c.candidate)}</h3><p>种子 ${c.seed} · ${a.selected===c.candidate?'当前选用':'候选'}</p><footer><a href="/workflow?${new URLSearchParams({id:a.id,candidate:c.candidate})}">本图工作流 ↓</a><button data-select="${escape(c.candidate)}" ${state.busy?'disabled':''}>${a.selected===c.candidate?'已选用':'选用这张'}</button></footer></section>`:`<section class="candidate"><h3>${escape(c.candidate)}</h3><p>${escape(c.status)} · 种子 ${c.seed}</p></section>`).join('')||'<p>还没有候选图。点击上方生成。</p>';
}
async function refresh(){try{const response=await fetch('/catalog');if(!response.ok)throw Error('无法读取素材');state=await response.json();if(!current)choose(state.assets[0].id);else render();}catch(error){el('status').textContent=error.message;}}
el('assets').onclick=e=>{const button=e.target.closest('[data-id]');if(button)choose(button.dataset.id);};
el('generate').onclick=async()=>{el('generate').disabled=true;try{await post('/generate',{id:current,prompt:el('prompt').value,seed:el('seed').value,count:Number(el('count').value)});await refresh();}catch(error){el('feedback').textContent=error.message;el('generate').disabled=false;}};
el('gallery').onclick=async e=>{const image=e.target.closest('[data-zoom]');if(image){el('zoom').querySelector('img').src=image.dataset.zoom;el('zoom').showModal();return;}const button=e.target.closest('[data-select]');if(button){try{await post('/select',{id:current,candidate:button.dataset.select});await refresh();}catch(error){el('feedback').textContent=error.message;}}};
el('close').onclick=()=>el('zoom').close();await refresh();setInterval(refresh,3000);
</script></html>
